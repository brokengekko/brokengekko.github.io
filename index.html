<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Portfolio of San Jaya Prime</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Special+Elite&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'shine': 'shine 0.75s ease-out',
                        'pulse-orb': 'pulse-orb 4s ease-in-out infinite',
                    },
                    keyframes: {
                        shine: {
                            '0%': { left: '-100%', opacity: '0' },
                            '10%': { opacity: '1' },
                            '80%': { left: '200%', opacity: '1' },
                            '100%': { left: '200%', opacity: '0' },
                        },
                        'pulse-orb': {
                            '0%, 100%': { 
                                boxShadow: '0 0 50px #00ffff, inset 0 0 50px #00ffff, inset 10px 0 40px rgba(255,255,255,0.8)' 
                            },
                            '50%': { 
                                boxShadow: '0 0 100px #00ffff, inset 0 0 80px #00ffff, inset 10px 0 40px rgba(255,255,255,0.8)' 
                            }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { margin: 0; background-color: #000000; overflow: hidden; }
        
        ::selection { background-color: #00ffff; color: #000000; text-shadow: none; }
        ::-moz-selection { background-color: #00ffff; color: #000000; text-shadow: none; }
        
        .orb {
            background: radial-gradient(circle at 30% 30%, #e0ffff, #00ffff 30%, #008b8b 70%, #000000 100%);
        }
		
		.menu-speckle {
		    position:absolute;
		    inset:0;
		    pointer-events:none;
		    overflow:hidden;
		    border-radius:inherit;
		    opacity:.16;
		    mix-blend-mode:screen;
		}

		.menu-speckle::before {
		    content:"";
		    position:absolute;
		    inset:-40%;
		    background-image:
		        radial-gradient(circle,#ffffffcc 0.4px,transparent 1px),
		        radial-gradient(circle,#ffffff66 0.6px,transparent 1.4px),
		        radial-gradient(circle,#00ffff55 0.8px,transparent 2px);
		    background-size: 14px 14px, 24px 24px, 34px 34px;
		    animation:speckleFloat 20s linear infinite;
		    filter:blur(.2px);
		}

		@keyframes speckleFloat {
		    from{ transform:translate(0px,0px) rotate(0deg); }
		    to{ transform:translate(-30px,-20px) rotate(360deg); }
		}
		
		.menu-edge {
		    position:absolute;
		    inset:0;
		    border-radius:inherit;
		    border:1px solid rgba(255,255,255,.18);
		    box-shadow:
		        inset 0 0 2px rgba(255,255,255,.45),
		        inset 0 0 18px rgba(255,255,255,.08),
		        0 0 12px rgba(0,255,255,.18);
		    pointer-events:none;
		}

        /* ===========================================
           Planet & Orbit Ring 3D Styles
           These styles define the floating animation for the central planet
           and the rotating 3D ring that holds the navigation planetoids.
        =========================================== */
        #planet-scene {
            transform-style: preserve-3d;
            animation: floatPlanet 10s ease-in-out infinite;
        }

        @keyframes floatPlanet {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        #orbit-ring {
            transform-style: preserve-3d;
            transform: rotateZ(-20deg) rotateX(70deg);
            animation: spinRing 30s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotateZ(-20deg) rotateX(70deg) rotateZ(0deg); }
            100% { transform: rotateZ(-20deg) rotateX(70deg) rotateZ(360deg); }
        }

        .quote-content p {
            font-size: 2.8em;
            line-height: 1.2;
        }

        .quote-content p:last-child {
            text-align: right;
            font-size: 1.8em;
            font-weight: 600;
            color: #ffcc00;
            margin-top: 20px;
        }

        .lightbox-content ul, .lightbox-content ol {
            margin: 20px 0;
            padding-left: 30px;
            color: rgba(255, 255, 255, 0.9);
        }

        .lightbox-content li {
            margin-bottom: 12px;
            position: relative;
            line-height: 1.6;
        }

        .lightbox-content ul {
            list-style: none;
        }

        .lightbox-content ul li::before {
            content: '■';
            position: absolute;
            left: -25px;
            color: var(--neon-cyan);
            font-size: 0.8em;
            top: 2px;
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .lightbox-content ol {
            list-style: none;
            counter-reset: tron-counter;
        }

        .lightbox-content ol li {
            counter-increment: tron-counter;
        }

        .lightbox-content ol li::before {
            content: counter(tron-counter) '.';
            position: absolute;
            left: -35px;
            color: var(--neon-magenta);
            font-weight: bold;
            font-family: monospace;
            text-shadow: 0 0 8px var(--neon-magenta);
        }

        .lightbox-content hr {
            border: 0;
            height: 1px;
            background-image: linear-gradient(to right, transparent, var(--neon-cyan), transparent);
            margin: 40px 0;
            opacity: 0.5;
        }

        .scale-wrapper {
            position: absolute;
            top: 0; left: 0;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .orbit-square {
            position: absolute;
            width: 50px;
            height: 50px;
            top: -25px;
            left: -25px;
            background-color: #111111;
        }

        .orbit-square::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1), inset 0 0 10px rgba(0, 255, 255, 0.1);
            animation: squarePulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes squarePulse {
            0%, 100% { 
                border-color: rgba(0, 255, 255, 0.3);
                box-shadow: 0 0 10px rgba(0,255,255,0.1), inset 0 0 10px rgba(0,255,255,0.1); 
            }
            50% { 
                border-color: rgba(0, 255, 255, 0.9);
                box-shadow: 0 0 25px rgba(0,255,255,0.6), inset 0 0 15px rgba(0,255,255,0.4); 
            }
        }

        @keyframes tumble1 { 100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(360deg); } }
        @keyframes tumble2 { 100% { transform: rotateX(-180deg) rotateY(360deg) rotateZ(-360deg); } }
        @keyframes tumble3 { 100% { transform: rotateX(360deg) rotateY(-360deg) rotateZ(180deg); } }


        /* ===========================================
           Digital Atmosphere (Cyber-Clouds) Styles
        =========================================== */
        .cyber-cloud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            background-color: rgba(0, 255, 255, 0.05);
            /* Complex dual-layer dot matrix grid */
            background-image: 
                radial-gradient(circle, #ffffff 1px, transparent 1.5px),
                radial-gradient(circle, #00ffff 2px, transparent 2px);
            background-size: 16px 16px, 24px 24px;
            
            /* Radical alpha-mask forces the hard plane into a soft, glowing spherical patch */
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 65%);
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 65%);
            
            mix-blend-mode: screen;
            animation: flowGrid 20s linear infinite;
        }

        /* Seamless background shifting gives the illusion of flowing atmospheric data */
        @keyframes flowGrid {
            from { background-position: 0 0, 0 0; }
            to { background-position: 48px 0, 72px 0; } 
        }

        @keyframes spinAtmosphere {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }


        /* ===========================================
           SJP Moon Logo Styles
        =========================================== */
        .tilt-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: pointer;
        }

        .layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            will-change: transform;
            pointer-events: none;
            border-radius: 8px;
        }

        .layer-3 { transform: translateZ(-20px) translate(0px, 0px); opacity: 0.9; }
        .layer-2 { transform: translateZ(0px) translate(0px, 0px); opacity: 1; }
        .layer-1 { transform: translateZ(30px) translate(0px, 0px); opacity: 1; }

        /* Base container styling. Added drop-shadow glow for the hover state. */
        #moon-logo-container {
            filter: saturate(1.5) brightness(1.2);
            transition: filter 0.3s ease;
        }

        #moon-logo-container:hover {
            filter: saturate(1.5) brightness(1.2) drop-shadow(0 0 15px rgba(0, 255, 255, 0.5)) drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
        }

        /* Increase base visibility of the SJP layer (layer-1) */
        .layer-1 {
            filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.5)) contrast(1.2);
        }

        /* 
           Hover effects for the individual logo layers:
           - Layer 3 (Comets) increases brightness by 20%
           - Layer 2 (Frosted Glass) increases brightness by 40%
           - Layer 1 (SJP foreground) becomes extremely bright, making the cyan glow nearly white 
        */
        #moon-logo-container:hover .layer-3 {
            filter: brightness(1.2);
        }
        #moon-logo-container:hover .layer-2 {
            filter: brightness(1.4);
        }
        #moon-logo-container:hover .layer-1 {
            filter: brightness(3.5) saturate(0.5) drop-shadow(0 0 20px rgba(200, 255, 255, 1)) drop-shadow(0 0 40px rgba(0, 255, 255, 0.8)) contrast(1.2);
        }

        /* Top-right corner social link icons (dimmed by default, lighting up with platform-specific neon glows on hover) */
        .social-icon-link {
            opacity: 0.55;
            filter: brightness(0.85) saturate(0.9);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
            will-change: filter, opacity, transform;
        }
        .social-icon-link:hover {
            opacity: 1;
            transform: scale(1.12) translateY(-1px);
        }
        .social-spotify:hover {
            filter: hue-rotate(-60deg) brightness(1.1) saturate(1.8) drop-shadow(0 0 2px rgba(30, 215, 96, 1)) drop-shadow(0 0 6px rgba(30, 215, 96, 0.95)) drop-shadow(0 0 14px rgba(30, 215, 96, 0.85)) drop-shadow(0 0 25px rgba(30, 215, 96, 0.7));
        }
        .social-redbubble:hover {
            filter: hue-rotate(175deg) brightness(1.1) saturate(2.0) drop-shadow(0 0 2px rgba(255, 25, 45, 1)) drop-shadow(0 0 6px rgba(255, 25, 45, 0.95)) drop-shadow(0 0 14px rgba(255, 25, 45, 0.85)) drop-shadow(0 0 25px rgba(255, 25, 45, 0.7));
        }
        .social-instagram:hover {
            filter: hue-rotate(110deg) brightness(1.15) saturate(1.8) drop-shadow(0 0 2px rgba(220, 10, 255, 1)) drop-shadow(0 0 6px rgba(220, 10, 255, 0.95)) drop-shadow(0 0 14px rgba(220, 10, 255, 0.85)) drop-shadow(0 0 25px rgba(220, 10, 255, 0.7));
        }

        /* ==========================================================================
           LIGHTBOX CSS INTEGRATION
           ========================================================================== */
        :root {
            --neon-cyan: #00f3ff;
            --neon-cyan-bright: #8bf6fe;
            --neon-yellow: #ffcc00;
            --neon-orange: #c2904a;
            --neon-magenta: #e000ff;
            --dark-bg: #110e25;
            --navy-bg: #030a16;
        }
        
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 10, 22, 0.55);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        @keyframes systemBoot {
            0%   { opacity: 0; filter: brightness(0) hue-rotate(90deg); }
            10%  { opacity: 1; filter: brightness(2); }
            15%  { opacity: 0.1; }
            25%  { opacity: 1; filter: brightness(1.5); }
            30%  { opacity: 0.4; }
            40%  { opacity: 1; filter: brightness(1); }
            100% { opacity: 1; filter: brightness(1); }
        }

        @keyframes systemShutdown {
            0%   { opacity: 1; filter: brightness(1); }
            30%  { opacity: 0.4; filter: brightness(1.5); }
            40%  { opacity: 1; filter: brightness(2); }
            70%  { opacity: 0.1; }
            80%  { opacity: 1; filter: brightness(2); }
            100% { opacity: 0; filter: brightness(0) hue-rotate(90deg); }
        }

        .flicker {
            opacity: 0; 
            animation: systemBoot 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: var(--delay, 0s);
        }

        .flicker-off {
            opacity: 1;
            animation: systemShutdown 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: var(--delay, 0s);
        }

        .tron-lightbox {
            position: relative;
            width: 95vw;
            height: 100vh;
            background: linear-gradient(180deg, rgba(17, 14, 37, 0.3) 0%, rgba(3, 10, 22, 0.4) 100%);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2), inset 0 0 50px rgba(0, 243, 255, 0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            grid-template-rows: 1fr;
            color: var(--neon-cyan);
            font-family: 'Courier New', Courier, monospace;
        }

        .corner-node {
            position: absolute;
            width: 16px; height: 16px;
            border: 2px solid var(--neon-cyan);
            background: var(--navy-bg);
            border-radius: 50%;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }
        .corner-node::after {
            content: ''; width: 6px; height: 6px;
            background: var(--neon-yellow);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-yellow);
        }
        
        .corner-node.tl { top: 1%; left: 1%; transform: translate(-50%, -50%); }
        .corner-node.tr { top: 1%; left: 99%; transform: translate(-50%, -50%); }
        .corner-node.bl-1 { top: 99%; left: 1%; transform: translate(-50%, -50%); }
        .corner-node.bl-2 { top: calc(99% - 32px); left: 1%; transform: translate(-50%, -50%); }
        .corner-node.bl-3 { top: calc(99% - 64px); left: 1%; transform: translate(-50%, -50%); }
        .corner-node.br-1 { top: 99%; left: 99%; transform: translate(-50%, -50%); }
        .corner-node.br-2 { top: calc(99% - 32px); left: 99%; transform: translate(-50%, -50%); }
        .corner-node.br-3 { top: calc(99% - 64px); left: 99%; transform: translate(-50%, -50%); }

        .border-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; pointer-events: none; z-index: 5;
        }

        @keyframes energyPulse {
            0%   { opacity: 0.5; filter: brightness(1); }
            50%  { opacity: 1; filter: brightness(1.5) drop-shadow(0 0 8px var(--neon-orange)); }
            100% { opacity: 0.5; filter: brightness(1); }
        }
        .power-line { animation: energyPulse 4s ease-in-out infinite; }
        
        @keyframes nodePulse {
            0%, 100% { r: 3; fill: var(--neon-cyan); opacity: 0.7; }
            50%      { r: 5; fill: #fff; opacity: 1; }
        }
        .data-node { animation: nodePulse 3s infinite; transform-origin: center; }

        .side-panel {
            position: relative; height: 100%;
            background-image: 
            radial-gradient(rgba(0, 243, 255, 0.4) 1px, transparent 1px),
            linear-gradient(0deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 10px 10px, 10px 50px; background-position: center;
            clip-path: polygon(15% 2%, 85% 2%, 85% 98%, 15% 98%); z-index: 2;
        }

        .side-panel::before {
            content: ''; position: absolute;
            top: 0; left: 15%; width: 70%; height: 8vh;
            background: linear-gradient(180deg, transparent, rgba(139, 246, 254, 0.8), transparent);
            animation: scanline 5s ease-in-out forwards;
            animation-iteration-count: var(--scanline-iterations, 1);
            animation-play-state: var(--scanline-state, running);
        }
        @keyframes scanline {
            0%   { transform: translateY(20vh); }
            50%  { transform: translateY(72vh); } 
            100% { transform: translateY(20vh); }
        }

        .close-btn, .back-btn {
            background: var(--navy-bg);
            border-radius: 50%;
            border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            outline: none;
            text-decoration: none;
        }

        .close-btn {
            position: absolute;
            top: 35px; left: 99%; transform: translateX(-50%);
            width: 44px; height: 44px;
            z-index: 50;
        }

        .back-btn {
            position: relative;
            width: 36px; height: 36px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .back-btn.dimmed {
            opacity: 0.3;
            pointer-events: none;
        }

        .back-btn.dimmed .ring-inner {
            animation: none;
            opacity: 0.2;
        }

        .close-btn .ring-outer, .back-btn .ring-outer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid var(--neon-cyan); border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6), inset 0 0 10px rgba(0, 243, 255, 0.4);
            transition: all 0.3s ease;
        }

        .close-btn .ring-inner, .back-btn .ring-inner {
            position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 2px dashed var(--neon-yellow); border-radius: 50%; opacity: 0.8;
            animation: rotateRing 10s linear infinite; transition: all 0.3s ease;
        }
        .back-btn .ring-inner { top: 4px; left: 4px; right: 4px; bottom: 4px; } 

        @keyframes rotateRing { 100% { transform: rotate(360deg); } }

        .close-btn svg, .back-btn svg {
            width: 18px; height: 18px; 
            fill: #ffffff;
            position: relative; z-index: 2; transition: all 0.3s ease;
            filter: drop-shadow(0 0 3px #ffffff);
        }

        .close-btn:hover .ring-outer, .back-btn:not(.dimmed):hover .ring-outer { 
            border-color: var(--neon-yellow); 
            box-shadow: 0 0 20px var(--neon-yellow); 
            transform: scale(1.1); 
        }
        .close-btn:hover svg, .back-btn:not(.dimmed):hover svg { 
            fill: var(--neon-yellow); 
            filter: drop-shadow(0 0 3px var(--neon-yellow));
        }

        .main-column {
            display: flex; flex-direction: column;
            height: 100%; position: relative;
            background: linear-gradient(180deg, rgba(17, 14, 37, 0.98) 0%, rgba(3, 10, 22, 1) 100%);
            z-index: 2; 
            padding: 0 30px; 
            box-sizing: border-box; 
            overflow-y: auto;
            overflow-x: hidden; 
            scrollbar-width: thin; 
            scrollbar-color: var(--neon-cyan) rgba(0,0,0,0.3); 
        }

        .main-column::-webkit-scrollbar { width: 8px; }
        .main-column::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-left: 1px solid rgba(0, 243, 255, 0.2); }
        .main-column::-webkit-scrollbar-thumb { background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }

        .lightbox-header {
            width: 100%; margin: 40px auto 0;
            height: 25vh; border: 1px solid rgba(0, 243, 255, 0.4);
            background: rgba(2, 6, 17, 0.8); position: relative;
            overflow: hidden; box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.1);
            flex-shrink: 0; box-sizing: border-box;
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        .lightbox-header::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 2px solid transparent;
            background: 
            linear-gradient(to right, var(--neon-cyan) 2px, transparent 2px) 0 0,
            linear-gradient(to bottom, var(--neon-cyan) 2px, transparent 2px) 0 0,
            linear-gradient(to left, var(--neon-cyan) 2px, transparent 2px) 100% 0,
            linear-gradient(to bottom, var(--neon-cyan) 2px, transparent 2px) 100% 0;
            background-size: 15px 15px; background-repeat: no-repeat; pointer-events: none;
        }

        .title-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 10px;
            flex-shrink: 0; box-sizing: border-box;
        }

        .lightbox-title {
            color: #fff; text-transform: uppercase; letter-spacing: 6px;
            font-size: 1.8rem; margin: 0;
            text-shadow: 0 0 8px #fff, 0 0 20px var(--neon-cyan);
            display: flex; align-items: center; justify-content: flex-end;
        }
        
        .lightbox-title::after {
            content: ''; display: inline-block; width: 15px; height: 15px;
            background: var(--neon-cyan); margin-left: 15px; box-shadow: 0 0 10px var(--neon-cyan);
        }

        .lightbox-content {
            flex: 1; 
            padding: 10px 0 40px 0; 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;
            align-content: start; box-sizing: border-box;
        }

        .data-module {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.02) 0%, rgba(0, 243, 255, 0.08) 100%);
            border: 1px solid rgba(0, 243, 255, 0.3); padding: 20px; position: relative; backdrop-filter: blur(4px);
            box-sizing: border-box;
        }
        
        .data-module::before, .data-module::after { content: ''; position: absolute; width: 12px; height: 12px; }
        .data-module::before { top: -1px; left: -1px; border-top: 2px solid var(--neon-yellow); border-left: 2px solid var(--neon-yellow); }
        .data-module::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--neon-yellow); border-right: 2px solid var(--neon-yellow); }

        .module-title { 
            font-size: 1.5rem;

        const updateCanonicalLink = (stub) => {
            let canonicalUrl = 'https://www.jayaprime.com/';
            if (stub && stub !== 'index') {
                canonicalUrl += '#?/' + stub;
            }

            let linkTag = document.querySelector('link[rel="canonical"]');
            if (!linkTag) {
                linkTag = document.createElement('link');
                linkTag.setAttribute('rel', 'canonical');
                document.head.appendChild(linkTag);
            }
            linkTag.setAttribute('href', canonicalUrl);
        };

        // Maintain a virtual referrer to track flow across SPA hash changes
        let spaReferrer = document.referrer || (window.location.origin + window.location.pathname);

        const lightBeacon = (stub, flareType = 'view') => {
            const webhookUrl = 'https://jayaprime.app.n8n.cloud/webhook/aeb5f51c-1c4a-4d52-a654-a7b45e103055';
            
            // Reconstruct the exact URL the user is navigating to (including article hash)
            let targetUrl = window.location.origin + window.location.pathname;
            if (stub !== 'index') {
                targetUrl += '#?/' + stub;
            }
            
            const payload = {
                page: stub,
                event: flareType,
                url: targetUrl,
                referrer: spaReferrer,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                screenResolution: `${window.screen.width}x${window.screen.height}`
            };

            // Update the SPA referrer to the current target for the NEXT navigation event
            spaReferrer = targetUrl;

            if (navigator.sendBeacon) {
                navigator.sendBeacon(webhookUrl, JSON.stringify(payload));
            } else {
                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => console.error('Beacon failed to ignite:', err));
            }

        function updatePlanetoidScales() {
            planetoids.forEach(p => {
                let scale = 1.0;

                if (state.tier1) {
                    if (p.data.t1 === state.tier1) {
                        scale += 0.80; 
                        if (state.tier2) {
                            if (p.data.t2 === state.tier2) {
                                scale += 0.90; 
                            } else {
                                scale -= 0.90; 
                            }
                        }
                    } else {
                        scale -= 0.80; 
                        if (state.tier2) scale -= 0.90;
                    }
                }
                
                scale = Math.max(0.1, scale);
                p.wrapper.style.transform = `scale(${scale})`;
            });
        }

        /*
           renderNav(): 
           Core function to generate the Tier 1, 2, and 3 navigation menus based on current state.
           It evaluates which categories are active, building DOM elements dynamically and applying
           tailwind utility classes for transitions and visibility.
        */
        function renderNav() {
            const t1Container = document.getElementById('tier1-nav');
            const t2Container = document.getElementById('tier2-nav');
            const t3Container = document.getElementById('tier3-nav');

            t1Container.innerHTML = '';
            MENU_DATA.tier1.forEach(item => {
                t1Container.appendChild(createMenuItem(item.label, state.tier1 === item.id, 1, () => {
                    if (item.url) {
                        window.location.href = item.url;
                        return;
                    }
                    if (state.tier1 === item.id) {
                        state.tier1 = null; state.tier2 = null; state.tier3 = null;
                    } else {
                        state.tier1 = item.id; state.tier2 = null; state.tier3 = null;
                    }
                    renderNav();
                }));
            });

            t2Container.innerHTML = '';
            const activeT1Data = MENU_DATA.tier1.find(i => i.id === state.tier1);
            
            if (activeT1Data && activeT1Data.tier2) {
                t2Container.classList.remove('opacity-0', 'scale-y-0', 'h-0', 'overflow-hidden');
                t2Container.classList.add('opacity-100', 'scale-y-100', 'h-auto', 'mb-2');
                
                activeT1Data.tier2.forEach(item => {
                    t2Container.appendChild(createMenuItem(item.label, state.tier2 === item.id, 2, () => {
                        if (item.url) {
                            window.location.href = item.url;
                            return;
                        }
                        if (state.tier2 === item.id) {
                            state.tier2 = null; state.tier3 = null;
                        } else {
                            state.tier2 = item.id; state.tier3 = null;
                        }
                        renderNav();
                    }));
                });
            } else {
                t2Container.classList.add('opacity-0', 'scale-y-0', 'h-0', 'overflow-hidden');
                t2Container.classList.remove('opacity-100', 'scale-y-100', 'h-auto', 'mb-2');
            }

            t3Container.innerHTML = '';
            const activeT2Data = activeT1Data?.tier2?.find(i => i.id === state.tier2);

            if (activeT2Data && activeT2Data.tier3) {
                t3Container.classList.remove('opacity-0', 'scale-y-0', 'h-0', 'overflow-hidden');
                t3Container.classList.add('opacity-100', 'scale-y-100', 'h-auto');

                activeT2Data.tier3.forEach(item => {
                    t3Container.appendChild(createMenuItem(item.label, state.tier3 === item.id, 3, () => {
                        if (item.url) {
                            window.location.href = item.url;
                            return;
                        }
                        state.tier3 = state.tier3 === item.id ? null : item.id;
                        renderNav();
                    }));
                });
            } else {
                t3Container.classList.add('opacity-0', 'scale-y-0', 'h-0', 'overflow-hidden');
                t3Container.classList.remove('opacity-100', 'scale-y-100', 'h-auto');
            }

            updatePlanetoidScales();
        }

                    const duration = 4 + Math.random() * 8;
                    const direction = Math.random() > 0.5 ? 'normal' : 'reverse';
                    const tumbleType = Math.floor(Math.random() * 3) + 1; 
                    
                    square.style.animation = `tumble${tumbleType} ${duration}s linear infinite ${direction}`;
                    square.style.animationDelay = `-${Math.random() * 10}s`;
                    
                    square.appendChild(img);

                    planetoids.push({
                        wrapper: scaleWrapper,
