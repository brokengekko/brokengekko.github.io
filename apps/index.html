<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Jaya Prime Mini-Apps</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --nav-bg: #1a1a24;
            --text-main: #00ffff;
            --text-secondary: #ff00ff;
            --highlight: #ffff00;
            --border-color: #33334d;
            --font-family: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cyberpunk Nav Bar */
        nav {
            background-color: var(--nav-bg);
            border-bottom: 2px solid var(--text-main);
            box-shadow: 0 0 10px var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 60px;
            flex-shrink: 0;
            z-index: 10;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--text-secondary);
        }

        .menus {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .menu-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 5px 10px;
            font-family: var(--font-family);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        select:hover, select:focus {
            box-shadow: 0 0 10px var(--text-main);
            border-color: var(--highlight);
            color: var(--highlight);
        }

        option {
            background-color: var(--nav-bg);
            color: var(--text-main);
        }

        /* Iframe container */
        .iframe-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        /* Cyberpunk scanlines effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
            opacity: 0.3;
        }

        /* Error/Loading Overlay */
        #overlay {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100vh - 60px);
            background-color: rgba(13, 13, 18, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        .overlay-content {
            border: 2px solid var(--text-secondary);
            padding: 30px;
            box-shadow: 0 0 15px var(--text-secondary);
            max-width: 600px;
        }

        .overlay-content h2 {
            margin-bottom: 15px;
            color: var(--highlight);
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <nav>
        <div class="title">Jaya Prime Mini-Apps</div>
        <div class="menus">
            <div class="menu-group">
                <span class="menu-label">Art Apps</span>
                <select id="art-menu">
                    <option value="grunge/index.html">FX Studio</option>
                </select>
            </div>
            <div class="menu-group">
                <span class="menu-label">Other Apps</span>
                <select id="otro-menu">
                    <option value="">-- Select App --</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="scanlines"></div>

    <div id="overlay">
        <div class="overlay-content">
            <h2 id="overlay-title">SYSTEM INITIALIZING...</h2>
            <p id="overlay-msg">Scanning subdirectories for applications...</p>
        </div>
    </div>

    <div class="iframe-container">
        <iframe id="app-frame" src="grunge/index.html" name="app-frame" title="App Frame"></iframe>
    </div>

    <script>
        const artMenu = document.getElementById('art-menu');
        const otroMenu = document.getElementById('otro-menu');
        const appFrame = document.getElementById('app-frame');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');

        let appsData = {
            Art: [],
            Otro: []
        };

        async function fetchApps() {
            try {
                // Fetch current directory listing
                const res = await fetch('./');
                if (!res.ok) throw new Error('Network response was not ok');
                
                const text = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'));
                
                // Extract directories
                const dirs = [];
                for (const a of links) {
                    let href = a.getAttribute('href');
                    if (!href) continue;
                    
                    // Decode URL just in case
                    href = decodeURIComponent(href);
                    
                    // Filter out parent directory and self
                    if (href === '../' || href === './' || href === '..' || href === '.') continue;
                    
                    // Many local servers append '/' to directories
                    if (href.endsWith('/')) {
                        dirs.push(href);
                    } else if (href.indexOf('.') === -1) {
                        // Sometimes no slash, but no extension usually means directory
                        dirs.push(href + '/');
                    }
                }

                // Make dirs unique and ignore known non-app dirs
                const uniqueDirs = [...new Set(dirs)].filter(d => d !== 'apps/');

                if (uniqueDirs.length === 0) {
                    throw new Error('No subdirectories found. Make sure directory listing is enabled on your server.');
                }

                // Check each directory for the txt file
                for (const dir of uniqueDirs) {
                    try {
                        const dirRes = await fetch(dir);
                        if (!dirRes.ok) continue;
                        
                        const dirText = await dirRes.text();
                        const dirDoc = parser.parseFromString(dirText, 'text/html');
                        const dirLinks = Array.from(dirDoc.querySelectorAll('a'));
                        
                        let foundApp = false;
                        for (const a of dirLinks) {
                            let fileHref = a.getAttribute('href');
                            if (!fileHref) continue;
                            fileHref = decodeURIComponent(fileHref);
                            
                            // Check for .txt and dash
                            if (fileHref.endsWith('.txt') && fileHref.includes('-')) {
                                // Extract filename (remove trailing slash if any, get basename)
                                const parts = fileHref.split('/');
                                const filename = parts[parts.length - 1];
                                
                                const nameWithoutExt = filename.replace('.txt', '');
                                const dashIndex = nameWithoutExt.lastIndexOf('-');
                                
                                if (dashIndex !== -1) {
                                    const appName = nameWithoutExt.substring(0, dashIndex).trim();
                                    const type = nameWithoutExt.substring(dashIndex + 1).trim();
                                    
                                    if (type === 'Art' || type === 'Otro') {
                                        appsData[type].push({
                                            name: appName,
                                            path: dir + 'index.html',
                                            dir: dir
                                        });
                                        foundApp = true;
                                        break; // Only one text file per directory
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.warn(`Could not read directory ${dir}`, e);
                    }
                }

                populateMenus();
                overlay.classList.add('hidden');

            } catch (error) {
                console.error("Initialization Error:", error);
                overlayTitle.innerText = "SYSTEM ERROR";
                overlayTitle.style.color = "#ff0000";
                overlayMsg.innerHTML = "Failed to fetch directory listings.<br><br>Ensure you are running a local web server (e.g., <code>python -m http.server</code> or <code>npx http-server</code>) that supports directory indexing, rather than opening this file directly via <code>file://</code> protocol.";
            }
        }

        function populateMenus() {
            // Sort menus alphabetically
            appsData.Art.sort((a, b) => a.name.localeCompare(b.name));
            appsData.Otro.sort((a, b) => a.name.localeCompare(b.name));

            // Populate Art Menu
            artMenu.innerHTML = '';
            appsData.Art.forEach(app => {
                const option = document.createElement('option');
                option.value = app.path;
                option.textContent = app.name;
                // Default to FX Studio in grunge
                if (app.dir === 'grunge/') {
                    option.selected = true;
                }
                artMenu.appendChild(option);
            });

            // Populate Otro Menu
            otroMenu.innerHTML = '<option value="">-- Select App --</option>';
            appsData.Otro.forEach(app => {
                const option = document.createElement('option');
                option.value = app.path;
                option.textContent = app.name;
                otroMenu.appendChild(option);
            });
            
            // Check if FX Studio was found, if not, set to the first available if any
            if (artMenu.options.length > 0 && artMenu.selectedIndex === -1) {
                artMenu.selectedIndex = 0;
            }
        }

        // Event Listeners for Menus
        artMenu.addEventListener('change', (e) => {
            if (e.target.value) {
                appFrame.src = e.target.value;
                // Reset other menu
                otroMenu.selectedIndex = 0;
            }
        });

        otroMenu.addEventListener('change', (e) => {
            if (e.target.value) {
                appFrame.src = e.target.value;
                // Reset other menu
                artMenu.selectedIndex = -1; // Deselect Art menu if possible, but select doesn't easily support unselected state if no blank option.
                // We could add a blank option to Art, but requirements say "Art Menu defaulting to FX Studio"
                // So maybe we just let it be, or we can add a placeholder dynamically.
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', fetchApps);

    </script>
</body>
</html>
