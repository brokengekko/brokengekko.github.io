<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Jaya Prime Mini-Apps</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --nav-bg: #1a1a24;
            --text-main: #00ffff;
            --text-secondary: #ff00ff;
            --highlight: #ffff00;
            --border-color: #33334d;
            --font-family: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cyberpunk Nav Bar */
        nav {
            background-color: var(--nav-bg);
            border-bottom: 2px solid var(--text-main);
            box-shadow: 0 0 10px var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 60px;
            flex-shrink: 0;
            z-index: 10;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--text-secondary);
        }

        .menus {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .menu-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 5px 10px;
            font-family: var(--font-family);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        select:hover, select:focus {
            box-shadow: 0 0 10px var(--text-main);
            border-color: var(--highlight);
            color: var(--highlight);
        }

        option {
            background-color: var(--nav-bg);
            color: var(--text-main);
        }

        .icon-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 5px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            box-shadow: 0 0 10px var(--text-main);
            border-color: var(--highlight);
            color: var(--highlight);
        }

        /* Iframe container */
        .iframe-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }


        /* Error/Loading Overlay */
        #overlay {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100vh - 60px);
            background-color: rgba(13, 13, 18, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        .overlay-content {
            border: 2px solid var(--text-secondary);
            padding: 30px;
            box-shadow: 0 0 15px var(--text-secondary);
            max-width: 600px;
        }

        .overlay-content h2 {
            margin-bottom: 15px;
            color: var(--highlight);
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <nav>
        <div class="title">Jaya Prime Mini-Apps</div>
        <div class="menus">
            <div class="menu-group">
                <span class="menu-label">Art Apps</span>
                <select id="art-menu">
                    <!-- Populated via JS -->
                </select>
            </div>
            <div class="menu-group">
                <span class="menu-label">Other Apps</span>
                <select id="otro-menu">
                    <!-- Populated via JS -->
                </select>
            </div>
            <button id="fullscreen-btn" title="Full Screen" class="icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
        </div>
    </nav>

    
    <div id="overlay">
        <div class="overlay-content">
            <h2 id="overlay-title">SYSTEM INITIALIZING...</h2>
            <p id="overlay-msg">Fetching application registry...</p>
        </div>
    </div>

    <div class="iframe-container">
        <iframe id="app-frame" src="grunge/index.html" name="app-frame" title="App Frame"></iframe>
    </div>

    <script>
        const artMenu = document.getElementById('art-menu');
        const otroMenu = document.getElementById('otro-menu');
        const appFrame = document.getElementById('app-frame');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');

        let appsData = {
            Art: [],
            Otro: []
        };

        async function initApps() {
            try {
                // Fetch the static json registry
                const res = await fetch('apps.json');
                if (!res.ok) throw new Error('apps.json not found');
                
                appsData = await res.json();
                
                // Hide overlay
                overlay.classList.add('hidden');
                
                // Populate Menus
                populateMenus();

            } catch (error) {
                console.error("Initialization Error:", error);
                overlayTitle.innerText = "REGISTRY ERROR";
                overlayTitle.style.color = "#ff0000";
                overlayMsg.innerHTML = "Failed to load <code>apps.json</code>.<br><br>Make sure to run <code>node update_apps.js</code> in the apps folder before uploading to GitHub Pages.";
            }
        }

        function populateMenus() {
            // Populate Art Menu
            artMenu.innerHTML = '';
            appsData.Art.forEach(app => {
                const option = document.createElement('option');
                option.value = app.path;
                option.textContent = app.name;
                // Default to FX Studio in grunge
                if (app.dir === 'grunge/') {
                    option.selected = true;
                }
                artMenu.appendChild(option);
            });

            // Populate Otro Menu
            otroMenu.innerHTML = '<option value="">-- Select App --</option>';
            appsData.Otro.forEach(app => {
                const option = document.createElement('option');
                option.value = app.path;
                option.textContent = app.name;
                otroMenu.appendChild(option);
            });
            
            // Check if FX Studio was found, if not, set to the first available if any
            if (artMenu.options.length > 0 && artMenu.selectedIndex === -1) {
                artMenu.selectedIndex = 0;
            }
        }

        // Event Listeners for Menus
        artMenu.addEventListener('change', (e) => {
            if (e.target.value) {
                appFrame.src = e.target.value;
                // Reset other menu
                otroMenu.selectedIndex = 0;
            }
        });

        otroMenu.addEventListener('change', (e) => {
            if (e.target.value) {
                appFrame.src = e.target.value;
                // Reset other menu
                artMenu.selectedIndex = -1;
            }
        });

        // Full Screen Event
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (appFrame.requestFullscreen) {
                appFrame.requestFullscreen();
            } else if (appFrame.webkitRequestFullscreen) { /* Safari */
                appFrame.webkitRequestFullscreen();
            } else if (appFrame.msRequestFullscreen) { /* IE11 */
                appFrame.msRequestFullscreen();
            }
        });

        // Initialize immediately
        window.addEventListener('DOMContentLoaded', initApps);

    </script>
</body>
</html>
