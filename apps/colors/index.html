<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHROMA_SYNC // Neural Palette Mapper</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ea;
            --cyber-yellow: #fcee0a;
            --grid-line: rgba(0, 243, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            text-align: center;
            padding: 2rem;
            border-bottom: 2px solid var(--neon-magenta);
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--cyber-yellow);
            text-shadow: 2px 2px 0px var(--neon-magenta), -2px -2px 0px var(--neon-cyan);
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            flex-grow: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .panel {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon-cyan);
            padding: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px;
            width: 20px; height: 20px;
            border-top: 2px solid var(--cyber-yellow);
            border-left: 2px solid var(--cyber-yellow);
        }

        .panel::after {
            content: '';
            position: absolute;
            bottom: -2px; right: -2px;
            width: 20px; height: 20px;
            border-bottom: 2px solid var(--cyber-yellow);
            border-right: 2px solid var(--cyber-yellow);
        }

        h2 {
            font-size: 1.2rem;
            color: var(--neon-magenta);
            border-bottom: 1px dashed var(--neon-cyan);
            padding-bottom: 0.5rem;
        }

        /* Form Controls */
        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 0.5rem 1rem;
        }

        .cyber-select {
            background: var(--bg-dark);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 0.5rem;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }

        .cyber-select:focus {
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 0.8rem 1.5rem;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            text-align: center;
            display: inline-block;
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .btn:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }
        .btn:disabled:hover {
            background: transparent;
            box-shadow: none;
        }

        .btn-action {
            border-color: var(--cyber-yellow);
            color: var(--cyber-yellow);
        }
        .btn-action:hover:not(:disabled) {
            background: var(--cyber-yellow);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--cyber-yellow);
        }

        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #333;
            background: #000;
            width: 100%;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            gap: 1px;
            background: #222;
            border: 1px solid var(--neon-cyan);
            margin-top: 1rem;
            width: 100%;
            overflow: hidden;
        }

        .color-block {
            aspect-ratio: 1 / 1;
            width: 100%;
            height: 100%;
        }

        /* Loading Overlay */
        #loader {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 10, 15, 0.9);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .glitch-text {
            font-size: 3rem;
            color: var(--neon-magenta);
            position: relative;
            animation: glitch 1s linear infinite;
        }

        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>CHROMA_SYNC //</h1>
        <p>SYS.VER: 1.0.7 // PROTOCOL: ADAPTIVE_PALETTE_SHIFT</p>
    </header>

    <main>
        <!-- Panel 1: Source -->
        <div class="panel">
            <h2>[01] SOURCE_DATA // EXTRACT PALETTE</h2>
            
            <div class="control-group">
                <label for="colorDepth">COLOR_DEPTH_LIMIT:</label>
                <select id="colorDepth" class="cyber-select">
                    <option value="4">4-BIT (4 CLR)</option>
                    <option value="16">EGA (16 CLR)</option>
                    <option value="32">EEGA (32 CLR)</option>
                    <option value="128">SUB-VGA (128 CLR)</option>
                    <option value="256" selected>VGA (256 CLR)</option>
                    <option value="512">SVGA (512 CLR)</option>
                </select>
            </div>

            <label class="btn">
                UPLOAD SOURCE IMAGE
                <input type="file" id="upload1" accept="image/*">
            </label>
            <canvas id="canvas1"></canvas>
            <div id="paletteContainer" class="palette-grid"></div>
            <button class="btn" id="dlPaletteBtn" disabled>DOWNLOAD .PNG PALETTE</button>
        </div>

        <!-- Panel 2: Target -->
        <div class="panel">
            <h2>[02] TARGET_DATA // APPLY SHIFT</h2>
            <label class="btn">
                UPLOAD TARGET IMAGE
                <input type="file" id="upload2" accept="image/*">
            </label>
            <canvas id="canvas2"></canvas>
            <button class="btn btn-action" id="processBtn" disabled>EXECUTE NEURAL SHIFT</button>
            <button class="btn" id="dlResultBtn" disabled>DOWNLOAD SHIFTED ASSET</button>
        </div>
    </main>

    <!-- Processing Overlay -->
    <div id="loader">
        <div class="glitch-text">PROCESSING_PIXELS...</div>
        <p style="margin-top: 1rem; color: var(--neon-cyan);">MAPPING COLOR SPACE. STAND BY.</p>
    </div>

    <script>
        const DOM = {
            upload1: document.getElementById('upload1'),
            upload2: document.getElementById('upload2'),
            canvas1: document.getElementById('canvas1'),
            canvas2: document.getElementById('canvas2'),
            colorDepth: document.getElementById('colorDepth'),
            paletteContainer: document.getElementById('paletteContainer'),
            dlPaletteBtn: document.getElementById('dlPaletteBtn'),
            dlResultBtn: document.getElementById('dlResultBtn'),
            processBtn: document.getElementById('processBtn'),
            loader: document.getElementById('loader')
        };

        const ctx1 = DOM.canvas1.getContext('2d');
        const ctx2 = DOM.canvas2.getContext('2d');
        
        let extractedPalette = [];
        let targetImgElement = new Image();
        let sourceImageLoaded = false;

        // Utility: Generate timestamped filename
        function generateFilename(base) {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}${mm}${dd}-${hh}${min}-${base}`;
        }

        // Global Save Shortcut
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (!DOM.dlResultBtn.disabled) {
                    const filename = generateFilename('ColorSynced.png');
                    triggerDownload(DOM.canvas2.toDataURL('image/png'), filename);
                }
            }
        });

        // Handle Image 1 Upload
        DOM.upload1.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => {
                const MAX_WIDTH = 600;
                let w = img.width;
                let h = img.height;
                if (w > MAX_WIDTH) {
                    h = Math.floor(h * (MAX_WIDTH / w));
                    w = MAX_WIDTH;
                }
                DOM.canvas1.width = w;
                DOM.canvas1.height = h;
                ctx1.drawImage(img, 0, 0, w, h);
                sourceImageLoaded = true;
                extractPalette();
                checkReadyState();
            };
            img.src = URL.createObjectURL(file);
        });

        // Dynamic recount if depth changes after upload
        DOM.colorDepth.addEventListener('change', () => {
            if (sourceImageLoaded) {
                extractPalette();
            }
        });

        // Handle Image 2 Upload
        DOM.upload2.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            targetImgElement = new Image();
            targetImgElement.onload = () => {
                const MAX_WIDTH = 800;
                let w = targetImgElement.width;
                let h = targetImgElement.height;
                if (w > MAX_WIDTH) {
                    h = Math.floor(h * (MAX_WIDTH / w));
                    w = MAX_WIDTH;
                }
                DOM.canvas2.width = w;
                DOM.canvas2.height = h;
                ctx2.drawImage(targetImgElement, 0, 0, w, h);
                checkReadyState();
            };
            targetImgElement.src = URL.createObjectURL(file);
        });

        function checkReadyState() {
            if (extractedPalette.length > 0 && DOM.canvas2.width > 0) {
                DOM.processBtn.disabled = false;
            }
        }

        function extractPalette() {
            const data = ctx1.getImageData(0, 0, DOM.canvas1.width, DOM.canvas1.height).data;
            const colorMap = new Map();
            const maxColors = parseInt(DOM.colorDepth.value);
            
            // Quantization - group similar colors
            const q = 16; 
            
            for (let i = 0; i < data.length; i += 4) {
                const r = Math.floor(data[i] / q) * q;
                const g = Math.floor(data[i+1] / q) * q;
                const b = Math.floor(data[i+2] / q) * q;
                const alpha = data[i+3];
                
                if (alpha < 128) continue;
                
                const hex = `${r},${g},${b}`;
                colorMap.set(hex, (colorMap.get(hex) || 0) + 1);
            }

            const sortedColors = [...colorMap.entries()].sort((a, b) => b[1] - a[1]);
            
            extractedPalette = sortedColors.slice(0, maxColors).map(entry => {
                const [r, g, b] = entry[0].split(',').map(Number);
                return { r, g, b };
            });

            // Pad with black if the image natively has fewer colors than requested limit
            while(extractedPalette.length < maxColors) {
                extractedPalette.push({r: 0, g: 0, b: 0});
            }

            renderPaletteUI(maxColors);
            DOM.dlPaletteBtn.disabled = false;
        }

        function renderPaletteUI(maxColors) {
            DOM.paletteContainer.innerHTML = '';
            
            // Calculate perfect grid layout and apply minmax to prevent blowout
            const cols = Math.ceil(Math.sqrt(maxColors));
            DOM.paletteContainer.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            
            extractedPalette.forEach(color => {
                const div = document.createElement('div');
                div.className = 'color-block';
                div.style.backgroundColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
                DOM.paletteContainer.appendChild(div);
            });
        }

        DOM.processBtn.addEventListener('click', () => {
            DOM.loader.style.display = 'flex';
            
            // Reset target image to un-shifted state in case they hit process twice
            ctx2.drawImage(targetImgElement, 0, 0, DOM.canvas2.width, DOM.canvas2.height);
            
            setTimeout(() => {
                applyPaletteShift();
                DOM.loader.style.display = 'none';
                DOM.dlResultBtn.disabled = false;
            }, 100);
        });

        function applyPaletteShift() {
            const w = DOM.canvas2.width;
            const h = DOM.canvas2.height;
            const imgData = ctx2.getImageData(0, 0, w, h);
            const data = imgData.data;

            const lookupCache = new Map();

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                const a = data[i+3];

                if (a === 0) continue;

                const key = `${r},${g},${b}`;
                if (lookupCache.has(key)) {
                    const cached = lookupCache.get(key);
                    data[i] = cached.r;
                    data[i+1] = cached.g;
                    data[i+2] = cached.b;
                    continue;
                }

                let minDistance = Infinity;
                let closestColor = extractedPalette[0];

                for (let j = 0; j < extractedPalette.length; j++) {
                    const pColor = extractedPalette[j];
                    const distance = Math.pow(r - pColor.r, 2) + Math.pow(g - pColor.g, 2) + Math.pow(b - pColor.b, 2);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestColor = pColor;
                    }
                }

                lookupCache.set(key, closestColor);

                data[i] = closestColor.r;
                data[i+1] = closestColor.g;
                data[i+2] = closestColor.b;
            }

            ctx2.putImageData(imgData, 0, 0);
        }

        // --- DOWNLOAD HANDLERS ---

        DOM.dlPaletteBtn.addEventListener('click', () => {
            const maxColors = parseInt(DOM.colorDepth.value);
            const cols = Math.ceil(Math.sqrt(maxColors));
            const rows = Math.ceil(maxColors / cols);
            
            const pCanvas = document.createElement('canvas');
            const blockSize = 32;
            pCanvas.width = cols * blockSize;
            pCanvas.height = rows * blockSize;
            const pCtx = pCanvas.getContext('2d');

            extractedPalette.forEach((color, i) => {
                const x = (i % cols) * blockSize;
                const y = Math.floor(i / cols) * blockSize;
                pCtx.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
                pCtx.fillRect(x, y, blockSize, blockSize);
            });

            const paletteFilename = generateFilename('ExtractedPalette.png');
            triggerDownload(pCanvas.toDataURL('image/png'), paletteFilename);
        });

        DOM.dlResultBtn.addEventListener('click', () => {
            const filename = generateFilename('ColorSynced.png');
            triggerDownload(DOM.canvas2.toDataURL('image/png'), filename);
        });

        function triggerDownload(dataURL, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
