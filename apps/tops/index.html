<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. The Meta Refresh Tag does the actual redirect. 0 = seconds to wait -->
    <meta http-equiv="refresh" content="0; URL=https://www.jayaprime.com/tops/">
    <!-- 2. The Canonical Link tells search engines where the real page is -->
    <link rel="canonical" href="https://www.jayaprime.com/tops/">
  </head>
  <body>
    <p>If you are not redirected automatically, follow this <a href="https://www.jayaprime.com/tops/">https://www.jayaprime.com/tops/</a>.</p>
  </body>
</html>
